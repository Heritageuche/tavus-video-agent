<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to us face to face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13233a;
    --paper: #eef3f1;
    --sea: #1f6f6b;
    --sea-dark: #164f4c;
    --muted: #5a6b7a;
    --error: #a3302a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  main { width: 100%; max-width: 760px; }
  h1 { font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.02em; }
  p { font-size: 1.1rem; line-height: 1.5; color: var(--muted); margin: 0 0 28px; max-width: 52ch; }
  .stage {
    aspect-ratio: 16 / 10; width: 100%; border-radius: 22px; overflow: hidden;
    background: var(--ink); display: grid; place-items: center; position: relative;
  }
  iframe { width: 100%; height: 100%; border: 0; }
  button {
    font: inherit; font-size: 1.15rem; font-weight: 700; color: #fff; background: var(--sea);
    border: 0; border-radius: 999px; padding: 18px 34px; cursor: pointer;
  }
  button:hover { background: var(--sea-dark); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  button[disabled] { opacity: .6; cursor: wait; }
  .note { margin-top: 14px; font-size: .95rem; color: var(--muted); }
  .note.err { color: var(--error); }
  .end { margin-top: 16px; background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 12px 24px; font-size: 1rem; }
  .end:hover { background: var(--ink); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Talk to us face to face</h1>
  <p>Start a video call with our AI assistant. It can see and hear you, so just talk like you would to a person.</p>
  <div class="stage" id="stage">
    <button id="start">Start video call</button>
  </div>
  <div class="note" id="note">You'll be asked to allow your camera and microphone.</div>
</main>
<script>
  const stage = document.getElementById("stage");
  const note = document.getElementById("note");
  const startBtn = document.getElementById("start");

  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    startBtn.textContent = "Connecting…";
    note.className = "note";
    note.textContent = "Starting your call. This takes a few seconds.";
    try {
      const r = await fetch("/api/start", { method: "POST" });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Call could not start.");
      stage.innerHTML = "";
      const frame = document.createElement("iframe");
      frame.src = data.url;
      frame.allow = "camera; microphone; fullscreen; display-capture; autoplay";
      stage.appendChild(frame);
      note.textContent = "";
      const end = document.createElement("button");
      end.className = "end";
      end.textContent = "End call";
      end.onclick = () => location.reload();
      note.appendChild(end);
    } catch (e) {
      startBtn.disabled = false;
      startBtn.textContent = "Start video call";
      note.className = "note err";
      note.textContent = "Call didn't start: " + e.message + " Check the server window for details.";
    }
  });
</script>
</body>
</html>
